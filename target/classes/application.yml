server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/visitor_management?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.visitor.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:vms-jwt-secret-key-2024-change-in-production-at-least-256-bits-long}
  expiration: 7200000

passcode:
  hmac-secret: ${PASSCODE_SECRET:vms-passcode-hmac-secret-key-2024-change-in-production}
  default-max-use: 2
  early-entry-minutes: 30

logging:
  level:
    com.visitor: DEBUG
