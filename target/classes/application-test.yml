spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.visitor.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-jwt-secret-key-for-unit-testing-at-least-256-bits-long-enough
  expiration: 3600000

passcode:
  hmac-secret: test-passcode-hmac-secret-key-for-unit-testing
  default-max-use: 2
  early-entry-minutes: 30

logging:
  level:
    com.visitor: DEBUG
