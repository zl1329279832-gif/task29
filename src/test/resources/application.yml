spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.visitor.model.entity
  configuration:
    map-underscore-to-camel-case: true

visitor:
  jwt:
    secret: TestSecretKeyForHS256AlgorithmMustBeLongEnoughForSecurity2024
    expiration: 86400000
    refresh-expiration: 604800000
  passcode:
    hmac-key: TestHmacKey2024
    default-max-uses: 2
    qr-size: 200
  gate:
    default-companion-limit: 0
    area-overtime-threshold: 60
